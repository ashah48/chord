name: macOS disk images
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    env:
      MACOSX_DEPLOYMENT_TARGET: "15.0"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked --bin chord
      - run: |
          test "$(lipo -archs target/release/chord)" = "${{ matrix.arch }}"
          bash packaging/macos-dmg.sh target/release/chord "${{ matrix.arch }}" dist
      - uses: actions/upload-artifact@v4
        with:
          name: Chord-macOS-${{ matrix.arch }}
          path: dist/*.dmg
          if-no-files-found: error
  backend:
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          cache: false
      - run: npm install --global pnpm@10.25.0
      - run: bash scripts/bootstrap-macos.sh
      - run: bash scripts/test-macos-backend.sh
