name: macOS disk images
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    env:
      MACOSX_DEPLOYMENT_TARGET: "15.0"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked --bin chord
      - run: |
          test "$(lipo -archs target/release/chord)" = "${{ matrix.arch }}"
          bash packaging/macos-dmg.sh target/release/chord "${{ matrix.arch }}" dist
      - uses: actions/upload-artifact@v4
        with:
          name: Chord-macOS-${{ matrix.arch }}
          path: dist/*.dmg
          if-no-files-found: error
